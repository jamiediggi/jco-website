<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- JC Monogram Circle -->
  <g transform="translate(5, 5)">
    <!-- Black C arc (right side of circle) -->
    <path d="M25 0 A25 25 0 0 1 25 50" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Red J shape (left side) -->
    <path d="M25 50 A25 25 0 0 1 0 25 L0 25 A12 12 0 0 0 12 37 L12 37 L12 8" stroke="#BE1E2D" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Red vertical bar of J -->
    <path d="M25 8 L25 42" stroke="#BE1E2D" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- JAMIE text -->
  <text x="70" y="38" font-family="Montserrat, sans-serif" font-weight="800" font-size="26" fill="#BE1E2D" letter-spacing="2">JAMIE</text>
  <!-- CLARKE text -->
  <text x="160" y="38" font-family="Montserrat, sans-serif" font-weight="800" font-size="26" fill="#1a1a1a" letter-spacing="2">CLARKE</text>
</svg>